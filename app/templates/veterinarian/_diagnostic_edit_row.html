<tr>{% for key,label in [('parameterName','Tên chỉ số'),('valueText','Giá trị chữ'),('valueNumeric','Giá trị số'),('unit','Đơn vị'),('referenceRange','Khoảng tham chiếu'),('abnormalFlag','Đánh dấu'),('note','Ghi chú')] %}<td><input aria-label="{{ label }}" name="item_{{ key }}" value="{{ row.get(key,'') }}" maxlength="{{ 150 if key in ['parameterName','referenceRange'] else 50 if key in ['unit','valueNumeric'] else 30 if key == 'abnormalFlag' else 2000 }}"></td>{% endfor %}<td><button class="dashboard-secondary-button vet-button-danger" type="button" data-remove-diagnostic-row aria-label="Xóa dòng chỉ số">×</button></td></tr>
